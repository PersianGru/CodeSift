[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codesift"
version = "0.1.0"
description = "Portable, local-first security checker: free scanners + local LLM triage + a short report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "rules/LICENSE.opengrep-rules"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "black"]

[project.scripts]
sift = "codesift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codesift = ["py.typed", "vm/codesift-gate.sh"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = "tests/(fixtures|bakeoff)/"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures", "tests/bakeoff"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "scripts"]
exclude = ["tests/fixtures/", "tests/bakeoff/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]
markers = ["live_vm: contacts the real sandbox VM (only with CODESIFT_LIVE_VM=1)"]
